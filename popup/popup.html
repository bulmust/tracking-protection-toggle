<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Protection Toggle</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../icons/icon-48.png" alt="Shield icon" class="logo" />
      <h1 class="title">Tracking Protection</h1>
    </div>

    <div class="toggle-section" id="toggle-section">
      <div class="status-label" id="status-label">Checking…</div>

      <button class="toggle-btn" id="toggle-btn" aria-label="Toggle tracking protection" aria-pressed="false">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </button>
    </div>

    <p class="hint" id="hint-text">Loading…</p>

    <p class="restart-note">After toggling, reload the page for changes to take effect.</p>

    <div class="info-banner" id="info" hidden>
      <span class="banner-icon">&#10003;</span>
      <span>Firefox's Enhanced Tracking Protection (ETP) is enabled.</span>
    </div>

    <div class="warning" id="warning" hidden>
      <span class="banner-icon">&#9888;</span>
      <span>Protection is OFF. Websites can track your activity across the web.</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
